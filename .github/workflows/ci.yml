name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Type-check, build & test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `build` runs vue-tsc (type-check) then vite build. The wails-generated
      # bindings under frontend/bindings are committed, so this needs no wails3.
      - name: Build (vue-tsc + vite)
        run: npm run build

      - name: Test (vitest)
        run: npm test

  go:
    name: vet, test & build Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Wails v3 links against GTK4 + WebKitGTK 6.0 via cgo on Linux; without
      # these headers `go vet`/`test`/`build` of the main package fail at
      # pkg-config ("Package 'gtk4' ... not found").
      - name: Install system dependencies (GTK4 + WebKitGTK 6.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # main.go has `//go:embed all:frontend/dist`, but the dir is gitignored.
      # A placeholder satisfies the embed for these compile-only checks (the real
      # dist is produced by the frontend job / a packaged build).
      - name: Stub embedded frontend assets
        run: |
          mkdir -p frontend/dist
          echo '<!doctype html><title>ci stub</title>' > frontend/dist/index.html

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Build the app package only — `./...` would also try to link the Wails
      # iOS scaffold under build/ios (a main package with no main func) and fail.
      - name: Build
        run: go build .
