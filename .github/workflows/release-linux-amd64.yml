name: Release Linux amd64

# Rebuild only the Linux x64 desktop packages and attach them to an existing
# GitHub Release. Cross-compiles on ubuntu-24.04-arm because native x64
# runners hang installing GTK/WebKit headers, and qemu cannot run Go.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload to"
        required: true
        default: "v0.1.0"
        type: string

concurrency:
  group: release-linux-amd64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  WAILS3_VERSION: v3.0.0-alpha2.103
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  package:
    name: Cross-compile linux-amd64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: v
        run: |
          TAG="${{ inputs.tag }}"
          [[ "${TAG}" == v* ]] || TAG="v${TAG}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cross-compile and package
        env:
          HIVE_VERSION: ${{ steps.v.outputs.version }}
        run: |
          chmod +x .github/scripts/package-linux.sh
          .github/scripts/package-linux.sh

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          ls -lh dist
          gh release upload "${TAG}" dist/* --clobber
          tmp=$(mktemp)
          gh release download "${TAG}" --pattern SHA256SUMS.txt --output "${tmp}" || true
          {
            if [[ -s "${tmp}" ]]; then
              grep -v 'Hive-.*-linux-amd64' "${tmp}" || true
            fi
            (cd dist && sha256sum *)
          } | sort -k2 > SHA256SUMS.txt
          gh release upload "${TAG}" SHA256SUMS.txt --clobber
          gh release view "${TAG}"
